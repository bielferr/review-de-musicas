<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Music Reviews</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="container">
    <h1>🎵 Music Reviews</h1>
<p class="subtitle">Pesquise músicas e avalie suas favoritas.</p>
<br>
      <section class="search">
        <input id="query" placeholder="Pesquisar músicas..." />
        <button id="btnSearch">Pesquisar</button>
      </section>

      <section id="results" class="grid"></section>

      <section class="reviews">
        <h2>Reviews</h2>
        <ul id="reviewsList"></ul>
      </section>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modalContent">
        <h2>Adicionar Review</h2>

        <input 
          id="ratingInput"
          type="number"
          min="0"
          max="10"
          placeholder="Nota (0-10)"
        />

        <textarea
          id="commentInput"
          placeholder="Escreva sua review..."
        ></textarea>

        <div class="modalActions">
          <button id="cancelModal" class="btn secondary">
            Cancelar
          </button>

          <button id="saveReview" class="btn">
            Salvar
          </button>
        </div>
      </div>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
